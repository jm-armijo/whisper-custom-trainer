# Commit gate. Every command runs against the venv interpreter directly rather
# than a bare `pytest`/`ruff`, so the hook works whether or not the venv is
# activated in the shell that runs git.
pre-commit:
  parallel: false
  commands:
    lint:
      glob: "*.py"
      run: venv/bin/ruff check .
    unit:
      run: venv/bin/python -m pytest -q
    integration:
      run: venv/bin/python -m pytest -m integration -q
    # The whole e2e tier. Every case drives a pty in real time, so this is the
    # slow half of the gate (~4min all in) - accepted deliberately: a commit is
    # only green when every automated test has actually run against it.
    e2e:
      run: venv/bin/python -m pytest -m e2e -q
