<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Whisper Recorder</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="titlebar">
      <button
        id="menu-toggle"
        class="menu-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="sidebar"
        aria-label="Toggle script menu"
      >
        ☰
      </button>
      <h1 id="title" class="title">loading…</h1>
    </header>

    <div class="layout">
      <nav id="sidebar" class="sidebar" aria-label="Scripts">
        <h2 class="sidebar-heading">Scripts</h2>
        <ul id="script-menu" class="script-menu"></ul>
      </nav>

      <main class="main">
        <ol id="chunk-list" class="chunk-list" aria-label="Script chunks"></ol>
      </main>
    </div>

    <footer class="footer">
      <!-- Purely visual: what it shows is announced through the live region
           below, so a screen-reader user loses nothing by not seeing it. -->
      <canvas id="waveform" class="waveform" aria-hidden="true" hidden></canvas>

      <p id="message" class="message" role="status" aria-live="polite"></p>

      <div id="status-bar" class="status-bar">
        <span id="record-dot" class="record-dot" hidden></span>
        <span id="status-state" class="status-state">IDLE</span>
        <span id="record-timer" class="record-timer"></span>
        <span id="status-legend" class="status-legend"></span>
      </div>

      <!-- The transport, laid out as the deck it is modelled on: the four keys
           in a single row of equal slabs, play/pause and stop together on the
           left, record set apart on the right under its own red cap.
           There are no Prev/Next keys: this is a web page, so a line is
           selected by tapping it, and a deck never had them either. Redo is
           gone for the same reason - recording over a finished line *is* the
           re-record, and Record asks before it discards the old take.
           A glyph is not a name a screen reader can announce, so each key
           carries its own aria-label; the view keeps the play key's label in
           step with what its next press will do. -->
      <div class="controls controls--transport">
        <!-- One key for both, the way a cassette deck pairs them: it plays,
             it pauses what is playing, and it resumes what is paused. The
             face is the deck's own pair glyph, and the view swaps it for a
             lone pause bar while a clip runs so the key always shows what the
             next press does. -->
        <button id="btn-play" class="control control--transport control--play" type="button"
                aria-label="Play">⏯</button>
        <button id="btn-stop" class="control control--transport control--stop" type="button"
                aria-label="Stop">⏹</button>
        <!-- Stop-and-record-next sits between Stop and Record because that is
             what it is: the two keys either side of it, pressed as one. No
             deck had this key, so it gets the seam between the two it
             combines rather than a place in the classic order. -->
        <button id="btn-next-take" class="control control--transport control--next-take"
                type="button" aria-label="Stop and record next">⏹⏺</button>
        <button id="btn-record" class="control control--transport control--record" type="button"
                aria-label="Record">⏺</button>
      </div>
    </footer>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
