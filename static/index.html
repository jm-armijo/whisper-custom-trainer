<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Whisper Recorder</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="titlebar">
      <button
        id="menu-toggle"
        class="menu-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="sidebar"
        aria-label="Toggle script menu"
      >
        ☰
      </button>
      <h1 id="title" class="title">loading…</h1>
    </header>

    <div class="layout">
      <nav id="sidebar" class="sidebar" aria-label="Scripts">
        <h2 class="sidebar-heading">Scripts</h2>
        <ul id="script-menu" class="script-menu"></ul>
      </nav>

      <main class="main">
        <ol id="chunk-list" class="chunk-list" aria-label="Script chunks"></ol>
      </main>
    </div>

    <footer class="footer">
      <!-- Purely visual: what it shows is announced through the live region
           below, so a screen-reader user loses nothing by not seeing it. -->
      <canvas id="waveform" class="waveform" aria-hidden="true" hidden></canvas>

      <p id="message" class="message" role="status" aria-live="polite"></p>

      <div id="status-bar" class="status-bar">
        <span id="record-dot" class="record-dot" hidden></span>
        <span id="status-state" class="status-state">IDLE</span>
        <span id="record-timer" class="record-timer"></span>
        <span id="status-legend" class="status-legend"></span>
      </div>

      <!-- Transport first, in cassette-deck order, then the cursor controls.
           A glyph is not a name a screen reader can announce, so each key
           carries its own aria-label; the view keeps the play key's label in
           step with what its next press will do. -->
      <div class="controls controls--transport">
        <!-- One key for both, the way a cassette deck pairs them: it plays,
             it pauses what is playing, and it resumes what is paused. Its
             glyph and accessible name are set by the view from the transport
             state, so the label always says what the next press will do. -->
        <button id="btn-play" class="control control--transport" type="button"
                aria-label="Play">▶</button>
        <button id="btn-stop" class="control control--transport" type="button"
                aria-label="Stop">⏹</button>
        <button id="btn-record" class="control control--transport control--record" type="button"
                aria-label="Record">⏺</button>
        <!-- Stop and record as one press: the two glyphs together are what the
             button does, in the order it does it. -->
        <button id="btn-next-take" class="control control--transport control--next-take"
                type="button" aria-label="Stop and record next">⏹⏺</button>
      </div>

      <div class="controls">
        <button id="btn-prev" class="control" type="button">Prev</button>
        <button id="btn-next" class="control" type="button">Next</button>
        <button id="btn-redo" class="control" type="button">Redo</button>
      </div>
    </footer>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
